# The definitions' module: everything under this directory but the checker's fixtures.
# Four naming rules are set aside because the contract names these services and their shapes: `Register`
# and `Session`, and one stream of envelopes in both directions.
version: v2
modules:
  - path: .
    excludes:
      - internal
lint:
  use:
    - STANDARD
  except:
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE

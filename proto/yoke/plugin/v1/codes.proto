// This surface's error codes. On the wire a code is
// its dotted name, which grows under a grammar across every surface; this enum is where every party reads
// the names from, each stated in its `code` option, and a code's meaning never changes under its name.
syntax = "proto3";

package yoke.plugin.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/yoke-project/yoke/proto/yoke/plugin/v1;pluginv1";

extend google.protobuf.EnumValueOptions {
  // The code's dotted name, as it travels.
  string code = 50000;
}

enum Code {
  CODE_UNSPECIFIED = 0;
  // The request does not decode, or a required field is absent.
  CODE_ADMISSION_STRUCTURAL_MALFORMED = 1 [(code) = "admission.structural.malformed"];
  // The Registry has no such plugin.
  CODE_ADMISSION_IDENTITY_UNKNOWN_PLUGIN = 2 [(code) = "admission.identity.unknown_plugin"];
  // No document composes this unit.
  CODE_ADMISSION_IDENTITY_UNKNOWN_UNIT = 3 [(code) = "admission.identity.unknown_unit"];
  // An operator disabled the plugin.
  CODE_ADMISSION_STATE_DISABLED = 4 [(code) = "admission.state.disabled"];
  // The token is not this Core's, or not for this pair.
  CODE_ADMISSION_AUTH_INVALID = 5 [(code) = "admission.auth.invalid"];
  // The startup window has passed.
  CODE_ADMISSION_AUTH_EXPIRED = 6 [(code) = "admission.auth.expired"];
  // The token has already been spent.
  CODE_ADMISSION_AUTH_CONSUMED = 7 [(code) = "admission.auth.consumed"];
  // The protocol version is absent, or this Core does not support it.
  CODE_ADMISSION_COMPAT_UNSUPPORTED = 8 [(code) = "admission.compat.unsupported"];
  // The process describes itself differently from its Manifest.
  CODE_ADMISSION_CONSISTENCY_DIVERGENT = 9 [(code) = "admission.consistency.divergent"];
  // This unit is already live.
  CODE_ADMISSION_CONFLICT_UNIT_LIVE = 10 [(code) = "admission.conflict.unit_live"];
  // The acceptance could not be turned into an enforceable Session.
  CODE_ADMISSION_SESSION_UNAVAILABLE = 11 [(code) = "admission.session.unavailable"];
  // The identity in a first envelope was never issued, is already used, or has ended.
  CODE_SESSION_UNKNOWN = 12 [(code) = "session.unknown"];
  // The Session ended before this message arrived.
  CODE_SESSION_REVOKED = 13 [(code) = "session.revoked"];
  // An envelope carries no payload, or a field exceeds its bound.
  CODE_SESSION_MESSAGE_MALFORMED = 14 [(code) = "session.message.malformed"];
  // A message identity repeated within one Session.
  CODE_SESSION_MESSAGE_DUPLICATE = 15 [(code) = "session.message.duplicate"];
  // A family arrived from the side that may not originate it.
  CODE_SESSION_DIRECTION = 16 [(code) = "session.direction"];
  // A family that must correlate did not.
  CODE_SESSION_CORRELATION_MISSING = 17 [(code) = "session.correlation.missing"];
  // A correlation names no message in this Session.
  CODE_SESSION_CORRELATION_UNKNOWN = 18 [(code) = "session.correlation.unknown"];
  // The operation names something declared but not authorised.
  CODE_SCOPE_WITHHELD = 19 [(code) = "scope.withheld"];
  // It names something the process never declared.
  CODE_SCOPE_UNDECLARED = 20 [(code) = "scope.undeclared"];
  // Data arrived for a stream that is not activated.
  CODE_STREAM_INACTIVE = 21 [(code) = "stream.inactive"];
  // An acknowledgement names a command that was never issued.
  CODE_COMMAND_UNKNOWN = 22 [(code) = "command.unknown"];
  // A response names a question that was never asked.
  CODE_QUERY_UNKNOWN = 23 [(code) = "query.unknown"];
}

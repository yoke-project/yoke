// An event as a subscriber receives it, and what a subscriber selects with.
syntax = "proto3";

package yoke.administrative.v1;

import "google/protobuf/timestamp.proto";
import "yoke/administrative/v1/codes.proto";

option go_package = "github.com/yoke-project/yoke/proto/yoke/administrative/v1;administrativev1";

// One conclusion the Core reached: eight fields, the same on every event.
message Event {
  // Numbers the event within one life of the instance; what a snapshot's sequence and a cause refer to.
  uint64 seq = 1;
  // What happened: <subject-kind>.<object>.<verb>, and what a subscription filters on.
  string type = 2;
  Subject subject = 3;
  // The Core's clock, at the conclusion.
  google.protobuf.Timestamp time = 4;
  Actor actor = 5;
  // 0 to 99, higher more serious.
  uint32 severity = 6;
  // The class a unit declared and was granted, on unit.occurrence.reported alone.
  string occurrence = 7;
  // The event this one follows from; zero where there is none.
  uint64 cause = 8;
  // Typed per type, and skippable: a consumer decodes only what it knows.
  bytes detail = 9;
}

// Who caused an event, established by the Core and never claimed.
message Actor {
  // core, operator, unit or host.
  string class = 1;
  // For an operator: the person the channel established, where it established one.
  string person = 2;
}

// What a subscription selects, on four independent axes combined by conjunction. An axis left empty
// selects everything on it.
message Filter {
  // A subject kind, and an identity where one is named.
  string subject_kind = 1;
  string subject_identity = 2;
  // At or above.
  uint32 floor = 3;
  // Exactly, or by prefix of segments.
  string type = 4;
  bool type_prefix = 5;
  // Exactly, or by prefix of segments; reaches only the events that carry one.
  string occurrence = 6;
  bool occurrence_prefix = 7;
}

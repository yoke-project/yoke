// The administrative contract's version, stated inside the contract. It is the integer every request
// carries, and it is the `v1` of this path: a contract whose two differ is rejected where the definitions
// are built.
syntax = "proto3";

// The administrative contract, v1: one union of operations, carried by two services.
package yoke.administrative.v1;

option go_package = "github.com/yoke-project/yoke/proto/yoke/administrative/v1;administrativev1";

enum Contract {
  CONTRACT_UNSPECIFIED = 0;
  CONTRACT_VERSION = 1;
}

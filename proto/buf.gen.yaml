# The Go built from the definitions, beside them and committed: a Go module is fetched, never generated.
# Both plugins run from source through the module proxy, so Go is the only toolchain.
version: v2
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12"]
    out: .
    opt: paths=source_relative
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2"]
    out: .
    opt: paths=source_relative

# Every proposed change runs this repository's own verbs, from a clean checkout
# (prj_structure/95 §Continuous integration). Every command is a verb, or a script under ci/.
name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      verify: ${{ steps.select.outputs.verify }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        run: ci/changed-paths.sh "${{ github.event.pull_request.base.sha || github.event.before }}" | ci/select-jobs.sh | sed 's/$/=true/' >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
        with:
          just-version: 1.58.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: just build
      - run: just lint
      - run: just fmt
      - run: just test
      - run: ci/record.sh > record.json
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: record-L1
          path: record.json
